<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DWG 瘦身助手</title>
  <style>
    :root{--bg:#06111f;--panel:#0d1d2e;--line:#29445b;--cyan:#36d5c6;--lime:#b9f45f;--text:#f4f8fb;--muted:#93a7ba}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 5%,#163143 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(920px,calc(100% - 32px));margin:auto;padding:54px 0}.brand{display:flex;align-items:center;gap:11px;font-weight:800}.logo{background:var(--cyan);color:#05201d;padding:8px 11px;clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}header{padding:70px 0 38px}small.kicker{color:var(--cyan);letter-spacing:.18em;font-weight:800}h1{font-size:clamp(42px,7vw,74px);line-height:1.04;letter-spacing:-.06em;margin:18px 0}h1 span{color:var(--lime)}.lead{color:var(--muted);font-size:17px;line-height:1.8;max-width:700px}.card{background:linear-gradient(145deg,#102338,#091725);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 30px 90px #0006}.drop{display:block;border:1px dashed #42657a;border-radius:17px;text-align:center;padding:58px 22px;cursor:pointer;background:#06111f77}.drop:hover{border-color:var(--cyan)}.drop input{display:none}.drop b{display:block;font-size:21px}.drop span{display:block;color:var(--muted);font-size:13px;margin-top:9px}.file{margin:15px 0;padding:14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);display:none}.controls{display:grid;grid-template-columns:1fr auto;gap:12px;margin-top:15px}select,button{border-radius:12px;padding:15px;border:1px solid var(--line);font:inherit}select{background:#081522;color:var(--text)}button{background:var(--cyan);color:#04211d;border:0;font-weight:900;cursor:pointer;min-width:180px}button:disabled{opacity:.5;cursor:wait}.progress{height:5px;background:#162b3d;border-radius:9px;margin-top:18px;overflow:hidden;display:none}.progress i{display:block;height:100%;width:35%;background:var(--lime);animation:move 1.2s infinite}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(350%)}}.status{font-size:13px;color:var(--muted);margin:14px 0 0;min-height:20px}.note{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.note span{border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:650px){.controls,.note{grid-template-columns:1fr}header{padding-top:48px}button{width:100%}}
  </style>
</head>
<body><main class="wrap"><div class="brand"><span class="logo">D</span>DWG 瘦身助手</div><header><small class="kicker">UPLOAD · OPTIMIZE · DELETE</small><h1>让 CAD 文件轻一点，<br><span>图纸内容不乱动。</span></h1><p class="lead">无需登录、无需安装。DWG 上传到临时处理目录，完成后立即返回缩小版并删除服务器临时文件。</p></header><section class="card"><label class="drop"><input id="file" type="file" accept=".dwg"><b>选择或拖入 DWG 文件</b><span>最大 100 MB · 原文件不会被覆盖</span></label><div class="file" id="fileInfo"></div><div class="controls"><select id="version"><option value="ACAD2018">保持 AutoCAD 2018 格式</option><option value="ACAD2013">另存为 AutoCAD 2013</option><option value="ACAD2010">另存为 AutoCAD 2010</option></select><button id="run">开始瘦身 →</button></div><div class="progress" id="progress"><i></i></div><p class="status" id="status">上传后由 ODA 引擎审计并重新写入 DWG。</p><div class="note"><span>无需账号</span><span>处理后自动删除</span><span>原文件保留</span></div></section></main><script>
    const file=document.querySelector('#file'),info=document.querySelector('#fileInfo'),run=document.querySelector('#run'),status=document.querySelector('#status'),progress=document.querySelector('#progress');
    const size=n=>(n/1024/1024).toFixed(2)+' MB';
    file.onchange=()=>{if(file.files[0]){info.style.display='block';info.textContent=file.files[0].name+' · '+size(file.files[0].size)}};
    run.onclick=async()=>{const f=file.files[0];if(!f){status.textContent='请先选择 DWG 文件';return}run.disabled=true;progress.style.display='block';status.textContent='正在上传并处理，免费服务器首次启动可能需要约一分钟…';const data=new FormData();data.append('file',f);data.append('version',document.querySelector('#version').value);try{const r=await fetch('/optimize',{method:'POST',body:data});if(!r.ok){const j=await r.json();throw new Error(j.error||'处理失败')}const blob=await r.blob();const oldN=Number(r.headers.get('X-Original-Size')||f.size),newN=Number(r.headers.get('X-Optimized-Size')||blob.size);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name.replace(/\.dwg$/i,'')+'_slim.dwg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);const saved=Math.max(0,(1-newN/oldN)*100);status.textContent=`完成：${size(oldN)} → ${size(newN)}，减小 ${saved.toFixed(1)}%`;}catch(e){status.textContent=e.message}finally{run.disabled=false;progress.style.display='none'}};
  </script></body></html>
